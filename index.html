<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Championship 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans Myanmar", sans-serif;}
  body{background:#0d0f12;color:#ffffff;font-size:13px;padding-bottom:30px}
  
  /* Header UI */
  header{background:#16191e;padding:16px 14px;border-bottom:1px solid #262b33;text-align:center}
  header h1{font-size:15px;line-height:1.4;font-weight:600;color:#f1f5f9}
  header p{font-size:11px;color:#94a3b8;margin-top:4px}
  
  /* Navigation Tabs */
  .nav-tabs{display:flex;background:#16191e;border-bottom:1px solid #262b33;position:sticky;top:0;z-index:100}
  .tab-btn{flex:1;padding:12px;text-align:center;font-weight:600;font-size:13px;color:#94a3b8;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
  .tab-btn.active{color:#22c55e;border-bottom-color:#22c55e}
  
  .container{max-width:600px;margin:0 auto;padding:12px 6px}
  .tab-content{display:none}
  .tab-content.active{display:block}
  
  /* Section Header & Cards */
  .section-title{font-size:14px;font-weight:700;color:#22c55e;margin:14px 4px 8px;display:flex;justify-content:space-between;align-items:center}
  .card{background:#16191e;border-radius:12px;padding:6px 2px;margin-bottom:16px;border:1px solid #262b33}
  
  /* MLS Style Matches / Fixtures */
  .match-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #22272e}
  .match-row:last-child{border-bottom:none}
  .match-meta{font-size:10px;color:#94a3b8;width:80px;line-height:1.4;flex-shrink:0}
  .match-teams-wrap{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
  
  .t-name{font-size:14px;font-weight:700;color:#ffffff;width:37%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-home{text-align:right}
  .t-away{text-align:left}
  .score-badge{background:#22272e;color:#22c55e;font-weight:700;font-size:12px;padding:5px 8px;border-radius:6px;min-width:46px;text-align:center;border:1px solid #2e3541;flex-shrink:0}
  
  /* MLS Style Standings Table (Compact for Mobile) */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
  th{color:#64748b;font-weight:600;padding:8px 2px;font-size:11px;text-align:center;border-bottom:1px solid #262b33}
  td{padding:10px 2px;text-align:center;border-bottom:1px solid #1c2128;color:#cbd5e1}
  
  /* အသင်းနာမည် ကော်လံ နေရာ အသေအချာ ညှိထားသည် */
  td.team-cell{text-align:left;font-weight:700;font-size:13px;color:#ffffff;display:flex;align-items:center;gap:3px;white-space:nowrap;padding-right:4px}
  .pos{width:16px;color:#94a3b8;font-size:11px;padding-left:2px}
  
  /* Qualified Highlight */
  tr:nth-child(1) .pos-bar, tr:nth-child(2) .pos-bar{content:'';width:3px;height:14px;background:#22c55e;display:inline-block;border-radius:2px;margin-right:2px}
  
  .pts{font-weight:700;color:#22c55e}
</style>
</head>
<body>

<header>
  <h1>၂၀၂၆ ခုနှစ်၊ ဖြူးမြို့နယ်စီမံခန့်ခွဲရေးနှင့် အုပ်ချုပ်ရေးကော်မတီ<br>ဥက္ကဌ ဖလား ရပ်ကွက် နှင့် ကျေးရွာအုပ်စု အလွတ်တန်း ဘောလုံးပြိုင်ပွဲ</h1>
  <p>Official Tournament Center</p>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('table')">Table</button>
  <button class="tab-btn" onclick="switchTab('fixtures')">Fixtures</button>
</div>

<div class="container">
  <!-- Table Tab -->
  <div id="table-tab" class="tab-content active">
    <div id="tablesContainer"></div>
  </div>

  <!-- Fixtures Tab -->
  <div id="fixtures-tab" class="tab-content">
    <div class="section-title"><span>Matches & Results</span></div>
    <div class="card" id="matchesContainer"></div>
  </div>
</div>

<script>
const teams = {
  A: ["ဇေယျဝတီ(၁)", "ကညွတ်ကွင်း", "ဖြူး(၁)", "ဖြူးအရှေ့", "ဘန်းလောင်"],
  B: ["ဇေယျဝတီ(၂)", "ညောင်ပင်သာ", "ဖြူး(၃)", "ဖြူး(၂)", "တံခွန်တိုင်ဒေသ"]
};

const matches = [
  { g: "A", home: 1, away: 4, score: "1 - 2", date: "27.7.2026", time: "3:00 PM" },
  { g: "B", home: 1, away: 4, score: "1 - 4", date: "28.7.2026", time: "3:00 PM" },
  { g: "A", home: 2, away: 3, score: "0 - 1", date: "29.7.2026", time: "3:00 PM" },
  { g: "B", home: 2, away: 3, score: "1 - 2", date: "30.7.2026", time: "3:00 PM" },
  { g: "A", home: 0, away: 4, score: "3 - 1", date: "31.7.2026", time: "3:00 PM" },
  { g: "B", home: 0, away: 4, score: "1 - 4", date: "1.8.2026", time: "3:00 PM" },
  { g: "A", home: 1, away: 2, score: "", date: "2.8.2026", time: "3:00 PM" },
  { g: "B", home: 1, away: 2, score: "", date: "3.8.2026", time: "3:00 PM" },
  { g: "A", home: 0, away: 3, score: "", date: "4.8.2026", time: "3:00 PM" },
  { g: "B", home: 0, away: 3, score: "", date: "5.8.2026", time: "3:00 PM" },
  { g: "A", home: 4, away: 2, score: "", date: "6.8.2026", time: "3:00 PM" },
  { g: "B", home: 4, away: 2, score: "", date: "7.8.2026", time: "3:00 PM" },
  { g: "A", home: 3, away: 1, score: "", date: "8.8.2026", time: "3:00 PM" },
  { g: "B", home: 3, away: 1, score: "", date: "9.8.2026", time: "3:00 PM" },
  { g: "A", home: 0, away: 2, score: "", date: "10.8.2026", time: "3:00 PM" },
  { g: "B", home: 0, away: 2, score: "", date: "11.8.2026", time: "3:00 PM" },
  { g: "A", home: 3, away: 4, score: "", date: "12.8.2026", time: "3:00 PM" },
  { g: "B", home: 3, away: 4, score: "", date: "13.8.2026", time: "3:00 PM" },
  { g: "A", home: 0, away: 1, score: "", date: "14.8.2026", time: "3:00 PM" },
  { g: "B", home: 0, away: 1, score: "", date: "15.8.2026", time: "3:00 PM" }
];

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if(tab === 'table'){
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('table-tab').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('fixtures-tab').classList.add('active');
  }
}

function renderFixtures(){
  const box = document.getElementById("matchesContainer");
  box.innerHTML = matches.map(m => {
    const hName = teams[m.g][m.home];
    const aName = teams[m.g][m.away];
    return `
      <div class="match-row">
        <div class="match-meta"><b>Group ${m.g}</b><br>${m.date}<br><span style="color:#22c55e">${m.time}</span></div>
        <div class="match-teams-wrap">
          <span class="t-name t-home">${escapeHtml(hName)}</span>
          <span class="score-badge">${m.score || 'VS'}</span>
          <span class="t-name t-away">${escapeHtml(aName)}</span>
        </div>
      </div>
    `;
  }).join("");
}

function stats(g){
  const teamList = teams[g] || [];
  const st = teamList.map((name, i) => ({name, pl:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0, i}));
  matches.filter(m => m.g === g && /^\d+\s*[-:]\s*\d+$/.test((m.score||'').trim()) && m.home !== m.away).forEach(m => {
    const [a, b] = m.score.split(/[-:]/).map(Number);
    const h = st[m.home], aw = st[m.away];
    if(h && aw){
      h.pl++; aw.pl++; h.gf += a; h.ga += b; aw.gf += b; aw.ga += a;
      if (a > b) { h.w++; aw.l++; h.pts += 3; }
      else if (a < b) { aw.w++; h.l++; aw.pts += 3; }
      else { h.d++; aw.d++; h.pts++; aw.pts++; }
    }
  });
  st.forEach(x => x.gd = x.gf - x.ga);
  return st.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
}

function renderTables(){
  let out = "";
  for(const g of ["A", "B"]){
    const st = stats(g);
    out += `
      <div class="section-title"><span>Group ${g} Standings</span></div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:16px">#</th>
                <th style="text-align:left">Team</th>
                <th>Pl</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
              </tr>
            </thead>
            <tbody>`;
    st.forEach((x, i) => {
      out += `
        <tr>
          <td class="pos"><span class="pos-bar"></span>${i+1}</td>
          <td class="team-cell">${escapeHtml(x.name)}</td>
          <td>${x.pl}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
          <td>${x.gf}</td><td>${x.ga}</td>
          <td>${x.gd > 0 ? '+'+x.gd : x.gd}</td>
          <td class="pts">${x.pts}</td>
        </tr>`;
    });
    out += `</tbody></table></div></div>`;
  }
  document.getElementById("tablesContainer").innerHTML = out;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

renderFixtures();
renderTables();
</script>
</body>
</html>
